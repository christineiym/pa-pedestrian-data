<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PA Pedestrian Data Coverage</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Pennsylvania pedestrian accessibility data coverage</h1>
      <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
    </div>
    <span class="badge-proto" title="Catalog entries other than OpenStreetMap are unverified candidates">Prototype · seed data</span>
  </header>

  <main class="layout">
    <section class="map-wrap" aria-label="Map">
      <div id="map"></div>
      <div class="map-legend" id="map-legend"></div>
    </section>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>

  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>

  <dialog id="schema-dialog" class="schema-dialog">
    <form method="dialog" class="dialog-head">
      <h2 id="schema-title">Schema</h2>
      <button class="btn ghost" aria-label="Close">✕</button>
    </form>
    <div id="schema-body" class="dialog-body"></div>
  </dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
