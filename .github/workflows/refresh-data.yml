name: Refresh data

# Weekly: re-download the PA OSM extract and GTFS feeds, recompute data/*.json, commit to the checked-out
# branch (the default branch on schedule) if anything changed, then ask GitHub Pages to rebuild.
# If Pages later deploys from a different branch, add `ref: <that branch>` to the checkout step.
# Census boundaries/population change rarely; rebuild them by running this with `census: true`.
on:
  schedule:
    - cron: "17 7 * * 1"   # Mondays 07:17 UTC
  workflow_dispatch:
    inputs:
      census:
        description: Also rebuild municipal boundaries and population
        type: boolean
        default: false

permissions:
  contents: write
  pages: write   # to request a Pages rebuild after pushing

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Census boundaries and population (optional)
        if: ${{ inputs.census }}
        run: |
          scripts/download_data.sh census
          python scripts/build_municipalities.py

      - name: OpenStreetMap metrics
        run: |
          scripts/download_data.sh osm
          python scripts/osm_coverage.py

      - name: Fixed-route transit (GTFS)
        run: |
          scripts/download_data.sh gtfs
          python scripts/fetch_gtfs.py
          python scripts/transit_coverage.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Refresh data ($(date -u +%Y-%m-%d))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        id: commit

      # Pages deploys from a branch; pushes made with GITHUB_TOKEN may not trigger a build, so request one.
      - name: Request GitHub Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "::warning::Could not request a Pages build; it may still build from the push." 
